name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  build-ipa:
    name: Archive and package IPA
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode project
        run: bash .github/scripts/generate-xcode-project.sh

      - name: Archive unsigned iOS app
        run: |
          set -o pipefail
          xcodebuild archive \
            -project LocalLLM.xcodeproj \
            -scheme LocalLLM \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/LocalLLM.xcarchive" \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee build-xcodebuild.log

      - name: Package IPA
        run: |
          set -euo pipefail
          app_path='build/LocalLLM.xcarchive/Products/Applications/LocalLLM.app'
          test -d "$app_path"
          mkdir -p build/Payload
          cp -R "$app_path" build/Payload/
          (cd build && ditto -c -k --sequesterRsrc --keepParent Payload LocalLLM.ipa)
          test -s build/LocalLLM.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalLLM-iOS-IPA
          path: |
            build/LocalLLM.ipa
            build-xcodebuild.log
          if-no-files-found: error
          retention-days: 14
