name: Build iOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'
      
      - name: Build for iOS
        run: |
          xcodebuild \
            -scheme LocalLLM \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/LocalLLM.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO
      
      - name: Create IPA
        run: |
          mkdir -p build/Payload
          cp -r build/LocalLLM.xcarchive/Products/Applications/LocalLLM.app build/Payload/
          cd build && zip -r LocalLLM.ipa Payload
          echo "✅ IPA created"
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LocalLLM-iOS
          path: build/LocalLLM.ipa
