name: iOS starter workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Test default scheme using any available iPhone simulator
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Default Scheme
        run: |
          # Find a workspace, project, or Swift package
          ws=$(ls -1A | grep -iE '\.xcworkspace$' || true)
          proj=$(ls -1A | grep -iE '\.xcodeproj$' || true)
          pkg=$(test -f Package.swift && echo "Package.swift" || true)

          if [ -n "$ws" ]; then
            filetype_parameter="workspace"
            file_to_build="$ws"
          elif [ -n "$proj" ]; then
            filetype_parameter="project"
            file_to_build="$proj"
          elif [ -n "$pkg" ]; then
            filetype_parameter="package"
            file_to_build=""
          else
            echo "ERROR: No .xcworkspace, .xcodeproj, or Package.swift found in the repository root."
            echo "Please add an Xcode project/workspace or a Swift Package manifest (Package.swift)."
            exit 1
          fi

          # If it's a project/workspace, list schemes safely and pick a sensible default
          if [ "$filetype_parameter" != "package" ]; then
            echo "Detected $filetype_parameter: $file_to_build"
            scheme_list=$(xcodebuild -list -json -"${filetype_parameter}" "$file_to_build" 2>/dev/null || true)
            if [ -z "$scheme_list" ]; then
              echo "ERROR: xcodebuild -list returned no data for $file_to_build"
              exit 1
            fi

            default=$(echo "$scheme_list" | ruby -e "require 'json'; s=STDIN.read; obj = JSON.parse(s) rescue nil; if obj.nil? then exit 1; end; if obj['project'] && obj['project']['targets'] && obj['project']['targets'][0]; puts obj['project']['targets'][0]; elsif obj['workspace'] && obj['workspace']['schemes'] && obj['workspace']['schemes'][0]; puts obj['workspace']['schemes'][0]; else exit 1; end")
            if [ $? -ne 0 ] || [ -z "$default" ]; then
              echo "ERROR: Could not determine a default scheme from xcodebuild output"
              exit 1
            fi
            echo "$default" > default
            echo "Using default scheme: $default"
          else
            # Swift Package: set a placeholder or adapt your build steps to build the package
            echo "Detected Swift Package (Package.swift)."
            # You can adjust this as needed; for now, set scheme to default placeholder
            echo "default" > default
          fi

      - name: Build
        env:
          scheme: ${{ 'default' }}
          platform: ${{ 'iOS Simulator' }}
        run: |
          device=`xcrun xctrace list devices 2>&1 | grep -oE 'iPhone.*?[^\(]+' | head -1 | awk '{$1=$1;print}' | sed -e "s/ Simulator$//"`
          if [ "$scheme" = default ]; then scheme=$(cat default); fi
          if [ "`ls -A | grep -i \\.xcworkspace\$`" ]; then filetype_parameter="workspace" && file_to_build="`ls -A | grep -i \\.xcworkspace\$`"; else filetype_parameter="project" && file_to_build="`ls -A | grep -i \\.xcodeproj\$`"; fi
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          xcodebuild build-for-testing -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -destination "platform=$platform,name=$device"

      - name: Test
        env:
          scheme: ${{ 'default' }}
          platform: ${{ 'iOS Simulator' }}
        run: |
          device=`xcrun xctrace list devices 2>&1 | grep -oE 'iPhone.*?[^\(]+' | head -1 | awk '{$1=$1;print}' | sed -e "s/ Simulator$//"`
          if [ "$scheme" = default ]; then scheme=$(cat default); fi
          if [ "`ls -A | grep -i \\.xcworkspace\$`" ]; then filetype_parameter="workspace" && file_to_build="`ls -A | grep -i \\.xcworkspace\$`"; else filetype_parameter="project" && file_to_build="`ls -A | grep -i \\.xcodeproj\$`"; fi
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          xcodebuild test-without-building -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -destination "platform=$platform,name=$device"
